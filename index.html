<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>破冰派对 - 陌生人问答游戏</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.05);
            --neon-cyan: #00d4aa;
            --neon-pink: #ff6b9d;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --border-radius: 20px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 212, 170, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(255, 107, 157, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        .page {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .page.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            width: 100%;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), #00a884);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 212, 170, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 212, 170, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.96);
        }

        .question-text {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.5;
            color: #f5e6d3;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        .question-en {
            font-size: 16px;
            color: var(--neon-cyan);
            margin-top: 10px;
            line-height: 1.5;
            font-weight: 500;
        }
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .question-card {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .question-card.animating {
            transform: scale(0.8);
            filter: blur(4px);
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin: 4px;
        }

        .tag-category {
            background: rgba(0, 212, 170, 0.2);
            color: var(--neon-cyan);
        }

        .tag-level-easy {
            background: rgba(0, 212, 170, 0.15);
            color: #4ade80;
        }

        .tag-level-medium {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .tag-level-hard {
            background: rgba(255, 107, 157, 0.15);
            color: var(--neon-pink);
        }

        input[type="text"] {
            -webkit-appearance: none;
            appearance: none;
        }

        button {
            touch-action: manipulation;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div id="home-page" class="page active">
        <div class="container" style="justify-content: center;">
            <div style="text-align: center;">
                <div style="margin-bottom: 40px;">
                    <div style="font-size: 64px; margin-bottom: 16px;">🎉</div>
                    <h1 id="title-text" style="font-size: 36px; font-weight: 800; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;">破冰派对</h1>
                    <p id="subtitle-text" style="color: var(--text-secondary); font-size: 16px;">让陌生的朋友，快速熟悉起来</p>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px;">
                    <button class="btn btn-primary" onclick="startRoundRobin()">
                        <div style="font-size: 20px; margin-bottom: 4px;">🔄</div>
                        <div id="rr-mode-text">轮流模式</div>
                        <div id="rr-mode-desc" style="font-size: 12px; font-weight: 400; opacity: 0.8; margin-top: 4px;">轮流转盘抽题，抽到的人回答</div>
                    </button>
                    
                    <button class="btn btn-secondary" onclick="startPickerMode()">
                        <div style="font-size: 20px; margin-bottom: 4px;">🎯</div>
                        <div id="picker-mode-text">出题模式</div>
                        <div id="picker-mode-desc" style="font-size: 12px; font-weight: 400; opacity: 0.7; margin-top: 4px;">你选问题，指定某人回答</div>
                    </button>
                </div>
                
                <button class="btn btn-secondary" onclick="showBrowsePage()" style="font-size: 14px; padding: 12px;">
                    <span id="browse-text">📚 浏览问题库</span>
                </button>
                
                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <button class="btn btn-secondary" onclick="shareGame()" style="font-size: 14px; padding: 12px;">
                        <span id="share-text">📤 分享给朋友</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 轮流模式 -->
    <div id="round-robin-page" class="page">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="back-btn" onclick="goHome()">←</button>
                <h2 id="rr-page-title" style="font-size: 18px; font-weight: 600;">轮流模式</h2>
                <div style="width: 40px;"></div>
            </div>
            
            <div style="text-align: center; margin-bottom: 30px;">
                <div id="rr-current-label" style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">当前回答者</div>
                <input type="text" id="current-player" value="玩家 1" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 12px 20px; color: white; font-size: 18px; text-align: center; width: 200px; outline: none;">
            </div>
            
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <div id="rr-card" class="question-card" style="margin-bottom: 30px;">
                    <div id="rr-tags" style="margin-bottom: 16px; display: none;">
                        <span id="rr-category-tag" class="tag tag-category"></span>
                        <span id="rr-level-tag" class="tag"></span>
                    </div>
                    <div id="rr-question-text" class="question-text">
                        点击下方按钮<br>抽取一个问题
                    </div>
                </div>
                
                <button id="rr-draw-btn" class="btn btn-primary" onclick="drawQuestionRR()" style="margin-bottom: 12px;">
                    <span id="rr-draw-text">🎲 抽一个问题</span>
                </button>
                
                <div id="rr-actions" style="display: none; flex-direction: column; gap: 12px;">
                    <button class="btn btn-primary" onclick="nextPlayer()">
                        <span id="rr-next-text">✓ 回答完毕，下一位</span>
                    </button>
                    <button class="btn btn-secondary" onclick="skipQuestionRR()">
                        <span id="rr-skip-text">↷ 跳过，重抽</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 出题模式 -->
    <div id="picker-page" class="page">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="back-btn" onclick="goHome()">←</button>
                <h2 id="picker-page-title" style="font-size: 18px; font-weight: 600;">出题模式</h2>
                <div style="width: 40px;"></div>
            </div>
            
            <div style="margin-bottom: 20px;">
                <div id="picker-filter-label" style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">问题分类</div>
                <div id="picker-filters" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>
            
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <div id="picker-card" class="question-card" style="margin-bottom: 30px;">
                    <div id="picker-tags" style="margin-bottom: 16px;">
                        <span id="picker-category-tag" class="tag tag-category"></span>
                        <span id="picker-level-tag" class="tag"></span>
                    </div>
                    <div id="picker-question-text" class="question-text">
                        加载中...
                    </div>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button class="btn btn-primary" onclick="refreshQuestionPicker()">
                        <span id="picker-change-text">🔄 换一题</span>
                    </button>
                    <button class="btn btn-secondary" onclick="showPickerTarget()">
                        <span id="picker-target-text">🎯 指定回答</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 浏览问题库 -->
    <div id="browse-page" class="page">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="back-btn" onclick="goHome()">←</button>
                <h2 id="browse-page-title" style="font-size: 18px; font-weight: 600;">问题库</h2>
                <div style="width: 40px;"></div>
            </div>
            
            <div style="margin-bottom: 16px;">
                <div id="browse-filters" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>
            
            <div id="browse-list" style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1;"></div>
        </div>
    </div>

    <script>

            { id: 5, question_zh: "你觉得穿搭最重要的是什么？舒适/个性/品牌/潮流？", question_en: "What matters most in fashion? Comfort / Personality / Brand / Trend?", category: "穿搭时尚", level: "medium" },
            { id: 6, question_zh: "如果要去一个荒岛，只能带三件衣服，你带什么？", question_en: "If you went to a deserted island with only 3 clothing items, what would they be?", category: "穿搭时尚", level: "medium" },
            { id: 7, question_zh: "你最不能接受的穿搭雷区是什么？", question_en: "What's your biggest fashion pet peeve?", category: "穿搭时尚", level: "medium" },
            { id: 8, question_zh: "你最想尝试但还没尝试过的穿搭风格是什么？", question_en: "What style have you always wanted to try but haven't yet?", category: "穿搭时尚", level: "medium" },
            { id: 9, question_zh: "你觉得男生/女生最加分的单品是什么？", question_en: "What's the most flattering item of clothing for men or women?", category: "穿搭时尚", level: "medium" },

            { id: 35, question_zh: "你觉得哪座城市的美食最让你念念不忘？", question_en: "Which city's food do you still crave?", category: "美食旅行", level: "easy" },
            { id: 36, question_zh: "你更喜欢一个人的旅行还是一群人的旅行？", question_en: "Do you prefer traveling alone or with a group?", category: "美食旅行", level: "easy" },

            { id: 37, question_zh: "最近有看什么剧/电影/综艺吗？推荐一部", question_en: "What show/movie/variety have you been watching? Recommend one!", category: "社会潮流", level: "easy" },
            { id: 38, question_zh: "如果只能留一个 App 在手机里，你留哪个？", question_en: "If you could only keep one app on your phone, which would it be?", category: "社会潮流", level: "medium" },

            { id: 44, question_zh: "你觉得社交媒体对你的生活有什么影响？", question_en: "What impact does social media have on your life?", category: "社会潮流", level: "medium" },
            { id: 45, question_zh: "你赞成还是反对'躺平'？为什么？", question_en: "Are you for or against 'lying flat'? Why?", category: "社会潮流", level: "hard" },

            { id: 48, question_zh: "你觉得当代社会最缺乏的是什么？", question_en: "What do you think contemporary society lacks the most?", category: "社会潮流", level: "hard" },

            { id: 49, question_zh: "如果你有一种超能力，但必须付出一个代价，你选什么？", question_en: "If you had a superpower but had to pay a price, what would you choose?", category: "趣味脑洞", level: "medium" },
            { id: 50, question_zh: "如果可以和任何历史人物吃顿饭，你选谁？", question_en: "If you could dine with any historical figure, who would you choose?", category: "趣味脑洞", level: "medium" },
            { id: 51, question_zh: "描述一下你理想中完美的一天", question_en: "Describe your perfect day", category: "趣味脑洞", level: "easy" },

            { id: 119, question_zh: "你觉得时间是治愈一切的良药吗？", question_en: "Do you think time heals all wounds?", category: "普鲁斯特问卷", level: "medium" },

        let currentPlayerIndex = 1;
        let currentQuestionRR = null;
        let usedQuestionsRR = new Set();
        let pickerFilter = '全部';
        let currentQuestionPicker = null;
        let browseFilter = '全部';

        function bilingualHTML(item) {
            return `<div class="question-text">${item.question_zh}</div><div class="question-en">${item.question_en}</div>`;
        }

        function getLevelLabel(level) {
            const map = { easy: '轻松', medium: '趣味', hard: '深度' };
            return map[level] || level;
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        function goHome() {
            showPage('home-page');
        }

        function startRoundRobin() {
            currentPlayerIndex = 1;
            usedQuestionsRR.clear();
            document.getElementById('current-player').value = '玩家 1';
            resetRRUI();
            showPage('round-robin-page');
        }

        function resetRRUI() {
            document.getElementById('rr-question-text').innerHTML = '<div class="question-text">点击下方按钮<br>抽取一个问题</div>';
            document.getElementById('rr-tags').style.display = 'none';
            document.getElementById('rr-draw-btn').style.display = 'block';
            document.getElementById('rr-actions').style.display = 'none';
            document.getElementById('rr-card').classList.remove('animating');
        }

        function drawQuestionRR() {
            const card = document.getElementById('rr-card');
            const drawBtn = document.getElementById('rr-draw-btn');
            
            drawBtn.disabled = true;
            card.classList.add('animating');
            
            setTimeout(() => {
                const available = questionDB.filter(q => !usedQuestionsRR.has(q.id));
                if (available.length === 0) {
                    usedQuestionsRR.clear();
                }
                const pool = available.length > 0 ? available : questionDB;
                currentQuestionRR = pool[Math.floor(Math.random() * pool.length)];
                usedQuestionsRR.add(currentQuestionRR.id);
                
                document.getElementById('rr-question-text').innerHTML = bilingualHTML(currentQuestionRR);
                document.getElementById('rr-category-tag').textContent = currentQuestionRR.category;
                document.getElementById('rr-level-tag').textContent = getLevelLabel(currentQuestionRR.level);
                document.getElementById('rr-level-tag').className = 'tag tag-level-' + currentQuestionRR.level;
                document.getElementById('rr-tags').style.display = 'block';
                
                card.classList.remove('animating');
                drawBtn.style.display = 'none';
                document.getElementById('rr-actions').style.display = 'flex';
                drawBtn.disabled = false;
            }, 300);
        }

        function nextPlayer() {
            currentPlayerIndex++;
            document.getElementById('current-player').value = '玩家 ' + currentPlayerIndex;
            resetRRUI();
        }

        function skipQuestionRR() {
            if (currentQuestionRR) {
                usedQuestionsRR.delete(currentQuestionRR.id);
            }
            drawQuestionRR();
        }

        function startPickerMode() {
            pickerFilter = '全部';
            renderPickerFilters();
            refreshQuestionPicker();
            showPage('picker-page');
        }

        function renderPickerFilters() {
            const container = document.getElementById('picker-filters');
            container.innerHTML = categories.map(cat => 
                `<button onclick="setPickerFilter('${cat}')" style="padding: 6px 14px; border-radius: 20px; border: 1px solid ${cat === pickerFilter ? 'var(--neon-cyan)' : 'rgba(255,255,255,0.2)'}; background: ${cat === pickerFilter ? 'rgba(0,212,170,0.2)' : 'rgba(255,255,255,0.05)'}; color: ${cat === pickerFilter ? 'var(--neon-cyan)' : 'var(--text-secondary)'}; font-size: 13px; cursor: pointer; transition: all 0.2s;">${cat}</button>`
            ).join('');
        }

        function setPickerFilter(category) {
            pickerFilter = category;
            renderPickerFilters();
            refreshQuestionPicker();
        }

        function refreshQuestionPicker() {
            const card = document.getElementById('picker-card');
            card.classList.add('animating');
            
            setTimeout(() => {
                const pool = pickerFilter === '全部' 
                    ? questionDB 
                    : questionDB.filter(q => q.category === pickerFilter);
                currentQuestionPicker = pool[Math.floor(Math.random() * pool.length)];
                
                document.getElementById('picker-question-text').innerHTML = bilingualHTML(currentQuestionPicker);
                document.getElementById('picker-category-tag').textContent = currentQuestionPicker.category;
                document.getElementById('picker-level-tag').textContent = getLevelLabel(currentQuestionPicker.level);
                document.getElementById('picker-level-tag').className = 'tag tag-level-' + currentQuestionPicker.level;
                
                card.classList.remove('animating');
            }, 300);
        }

        function showPickerTarget() {
            const name = prompt('请指定回答者名字（可选）:', '');
            if (name && name.trim()) {
                alert('请 ' + name.trim() + ' 回答这个问题！');
            }
        }

        function showBrowsePage() {
            browseFilter = '全部';
            renderBrowseFilters();
            renderBrowseList();
            showPage('browse-page');
        }

        function renderBrowseFilters() {
            const container = document.getElementById('browse-filters');
            container.innerHTML = categories.map(cat => 
                `<button onclick="setBrowseFilter('${cat}')" style="padding: 6px 14px; border-radius: 20px; border: 1px solid ${cat === browseFilter ? 'var(--neon-cyan)' : 'rgba(255,255,255,0.2)'}; background: ${cat === browseFilter ? 'rgba(0,212,170,0.2)' : 'rgba(255,255,255,0.05)'}; color: ${cat === browseFilter ? 'var(--neon-cyan)' : 'var(--text-secondary)'}; font-size: 13px; cursor: pointer; transition: all 0.2s;">${cat}</button>`
            ).join('');
        }

        function setBrowseFilter(category) {
            browseFilter = category;
            renderBrowseFilters();
            renderBrowseList();
        }

        function renderBrowseList() {
            const container = document.getElementById('browse-list');
            const list = browseFilter === '全部' 
                ? questionDB 
                : questionDB.filter(q => q.category === browseFilter);
            
            container.innerHTML = list.map(q => `
                <div class="card" style="padding: 16px;">
                    <div style="margin-bottom: 8px;">
                        <span class="tag tag-category" style="font-size: 11px;">${q.category}</span>
                        <span class="tag tag-level-${q.level}" style="font-size: 11px;">${getLevelLabel(q.level)}</span>
                    </div>
                    <div style="font-size: 15px; line-height: 1.5; margin-bottom: 6px;">${q.question_zh}</div>
                     <div style="font-size: 13px; color: var(--neon-cyan); line-height: 1.4;">${q.question_en}</div>
                </div>
            `).join('');
        }

        function shareGame() {
            const url = 'https://calvinfuchoco.github.io/icebreaker-game/';
            const text = '🎉 来玩「破冰派对」！让陌生的朋友快速熟悉起来~';
            
            if (navigator.share) {
                navigator.share({
                    title: '破冰派对 | ปาร์ตี้ละลายน้ำแข็ง',
                    text: text,
                    url: url
                }).catch(() => {});
            } else {
                const input = document.createElement('textarea');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('链接已复制，快去分享给朋友吧！');
            }
        }
    </script>
