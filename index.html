<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>破冰派对 - 陌生人问答游戏</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.05);
            --neon-cyan: #00d4aa;
            --neon-pink: #ff6b9d;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --border-radius: 20px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 212, 170, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(255, 107, 157, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        .page {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .page.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            width: 100%;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), #00a884);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 212, 170, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 212, 170, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.96);
        }

        .btn-lang {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .btn-lang:active {
            background: rgba(255, 255, 255, 0.15);
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .question-card {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .question-card.animating {
            transform: scale(0.8);
            filter: blur(4px);
        }

        .question-text {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.5;
            color: #f5e6d3;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin: 4px;
        }

        .tag-category {
            background: rgba(0, 212, 170, 0.2);
            color: var(--neon-cyan);
        }

        .tag-level-easy {
            background: rgba(0, 212, 170, 0.15);
            color: #4ade80;
        }

        .tag-level-medium {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .tag-level-hard {
            background: rgba(255, 107, 157, 0.15);
            color: var(--neon-pink);
        }

        input[type="text"] {
            -webkit-appearance: none;
            appearance: none;
        }

        button {
            touch-action: manipulation;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }
    </style>
</head>
<body>
    <button class="btn-lang" onclick="toggleLang()">TH</button>

    <!-- 首页 -->
    <div id="home-page" class="page active">
        <div class="container" style="justify-content: center;">
            <div style="text-align: center;">
                <div style="margin-bottom: 40px;">
                    <div style="font-size: 64px; margin-bottom: 16px;">🎉</div>
                    <h1 id="title-text" style="font-size: 36px; font-weight: 800; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;">破冰派对</h1>
                    <p id="subtitle-text" style="color: var(--text-secondary); font-size: 16px;">让陌生的朋友，快速熟悉起来</p>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px;">
                    <button class="btn btn-primary" onclick="startRoundRobin()">
                        <div style="font-size: 20px; margin-bottom: 4px;">🔄</div>
                        <div id="rr-mode-text">轮流模式</div>
                        <div id="rr-mode-desc" style="font-size: 12px; font-weight: 400; opacity: 0.8; margin-top: 4px;">轮流转盘抽题，抽到的人回答</div>
                    </button>
                    
                    <button class="btn btn-secondary" onclick="startPickerMode()">
                        <div style="font-size: 20px; margin-bottom: 4px;">🎯</div>
                        <div id="picker-mode-text">出题模式</div>
                        <div id="picker-mode-desc" style="font-size: 12px; font-weight: 400; opacity: 0.7; margin-top: 4px;">你选问题，指定某人回答</div>
                    </button>
                </div>
                
                <button class="btn btn-secondary" onclick="showBrowsePage()" style="font-size: 14px; padding: 12px;">
                    <span id="browse-text">📚 浏览问题库</span>
                </button>
                
                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <button class="btn btn-secondary" onclick="shareGame()" style="font-size: 14px; padding: 12px;">
                        <span id="share-text">📤 分享给朋友</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 轮流模式 -->
    <div id="round-robin-page" class="page">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="back-btn" onclick="goHome()">←</button>
                <h2 id="rr-page-title" style="font-size: 18px; font-weight: 600;">轮流模式</h2>
                <div style="width: 40px;"></div>
            </div>
            
            <div style="text-align: center; margin-bottom: 30px;">
                <div id="rr-current-label" style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">当前回答者</div>
                <input type="text" id="current-player" value="玩家 1" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 12px 20px; color: white; font-size: 18px; text-align: center; width: 200px; outline: none;">
            </div>
            
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <div id="rr-card" class="question-card" style="margin-bottom: 30px;">
                    <div id="rr-tags" style="margin-bottom: 16px; display: none;">
                        <span id="rr-category-tag" class="tag tag-category"></span>
                        <span id="rr-level-tag" class="tag"></span>
                    </div>
                    <div id="rr-question-text" class="question-text">
                        点击下方按钮<br>抽取一个问题
                    </div>
                </div>
                
                <button id="rr-draw-btn" class="btn btn-primary" onclick="drawQuestionRR()" style="margin-bottom: 12px;">
                    <span id="rr-draw-text">🎲 抽一个问题</span>
                </button>
                
                <div id="rr-actions" style="display: none; flex-direction: column; gap: 12px;">
                    <button class="btn btn-primary" onclick="nextPlayer()">
                        <span id="rr-next-text">✓ 回答完毕，下一位</span>
                    </button>
                    <button class="btn btn-secondary" onclick="skipQuestionRR()">
                        <span id="rr-skip-text">↷ 跳过，重抽</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 出题模式 -->
    <div id="picker-page" class="page">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="back-btn" onclick="goHome()">←</button>
                <h2 id="picker-page-title" style="font-size: 18px; font-weight: 600;">出题模式</h2>
                <div style="width: 40px;"></div>
            </div>
            
            <div style="margin-bottom: 20px;">
                <div id="picker-filter-label" style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">问题分类</div>
                <div id="picker-filters" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>
            
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <div id="picker-card" class="question-card" style="margin-bottom: 30px;">
                    <div id="picker-tags" style="margin-bottom: 16px;">
                        <span id="picker-category-tag" class="tag tag-category"></span>
                        <span id="picker-level-tag" class="tag"></span>
                    </div>
                    <div id="picker-question-text" class="question-text">
                        加载中...
                    </div>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button class="btn btn-primary" onclick="refreshQuestionPicker()">
                        <span id="picker-change-text">🔄 换一题</span>
                    </button>
                    <button class="btn btn-secondary" onclick="showPickerTarget()">
                        <span id="picker-target-text">🎯 指定回答</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 浏览问题库 -->
    <div id="browse-page" class="page">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="back-btn" onclick="goHome()">←</button>
                <h2 id="browse-page-title" style="font-size: 18px; font-weight: 600;">问题库</h2>
                <div style="width: 40px;"></div>
            </div>
            
            <div style="margin-bottom: 16px;">
                <div id="browse-filters" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>
            
            <div id="browse-list" style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1;"></div>
        </div>
    </div>

    <script>
        const i18n = {

                friendship: 'มิตรภาพจีน-ไทย'

        const categories = ["全部", "穿搭时尚", "宠物生活", "美食旅行", "社会潮流", "普鲁斯特问卷", "趣味脑洞", "中泰友谊"];

        const questionDB = [
            { id: 1, question_zh: "如果你只能穿一种颜色的衣服过一辈子，你会选什么颜色？", question_th: "ถ้าคุณใส่เสื้อผ้าสีเดียวไปตลอดชีวิต จะเลือกสีอะไร?", category: "穿搭时尚", level: "easy" },
            { id: 2, question_zh: "你今天的穿搭灵感是什么？", question_th: "วันนี้คุณได้แรงบันดาลใจในการแต่งตัวมาจากอะไร?", category: "穿搭时尚", level: "easy" },

            { id: 5, question_zh: "你买过最后悔的一件衣服是什么？", question_th: "เสื้อผ้าชิ้นไหนที่ซื้อมาแล้วเสียใจที่สุด?", category: "穿搭时尚", level: "medium" },

            { id: 10, question_zh: "你最喜欢的时尚博主或明星是谁？", question_th: "บล็อกเกอร์หรือดาราแฟชั่นคนโปรดคือใคร?", category: "穿搭时尚", level: "easy" },

            { id: 11, question_zh: "猫派还是狗派？为什么？", question_th: "ชอบแมวหรือหมา? ทำไม?", category: "宠物生活", level: "easy" },
            { id: 12, question_zh: "如果你可以养任何动物当宠物（不限现实），你选什么？", question_th: "ถ้าเลี้ยงสัตว์อะไรก็ได้เป็นสัตว์เลี้ยง (ไม่จำกัดความเป็นจริง) จะเลือกอะไร?", category: "宠物生活", level: "medium" },

            { id: 18, question_zh: "你最喜欢去动物园看哪种动物？", question_th: "ชอบไปสวนสัตว์ดูสัตว์ชนิดไหนมากที่สุด?", category: "宠物生活", level: "easy" },

            { id: 74, question_zh: "如果让你教泰国朋友一句中文，你教什么？", question_th: "ถ้าให้สอนภาษาจีนให้เพื่อนไทยหนึ่งประโยค จะสอนอะไร?", category: "中泰友谊", level: "easy" },
            { id: 75, question_zh: "你觉得泰国人最热爱什么活动？", question_th: "คิดว่าคนไทยชอบทำกิจกรรมอะไรมากที่สุด?", category: "中泰友谊", level: "easy" },
            { id: 76, question_zh: "如果你去泰国开一家店，你会开什么类型的店？", question_th: "ถ้าไปเปิดร้านที่ไทย จะเปิดร้านประเภทไหน?", category: "中泰友谊", level: "medium" },
            { id: 77, question_zh: "你觉得中泰友谊中最重要的是什么？", question_th: "คิดว่าอะไรสำคัญที่สุดในมิตรภาพจีน-ไทย?", category: "中泰友谊", level: "medium" }
        ];

        let currentLang = 'zh';
        let currentPlayerIndex = 1;
        let currentQuestionRR = null;
        let usedQuestionsRR = new Set();
        let pickerFilter = '全部';
        let currentQuestionPicker = null;
        let browseFilter = '全部';

        function t(key) {
            return i18n[currentLang][key] || key;
        }

        function qText(item) {
            return currentLang === 'zh' ? item.question_zh : item.question_th;
        }

        function getLevelLabel(level) {
            const map = { easy: t('easy'), medium: t('medium'), hard: t('hard') };
            return map[level] || level;
        }

        function renderUI() {
            document.getElementById('title-text').textContent = t('title');
            document.getElementById('subtitle-text').textContent = t('subtitle');
            document.getElementById('rr-mode-text').textContent = t('rrMode');
            document.getElementById('rr-mode-desc').textContent = t('rrModeDesc');
            document.getElementById('picker-mode-text').textContent = t('pickerMode');
            document.getElementById('picker-mode-desc').textContent = t('pickerModeDesc');
            document.getElementById('browse-text').textContent = t('browse');
            document.getElementById('share-text').textContent = t('share');
            document.getElementById('rr-page-title').textContent = t('rrPageTitle');
            document.getElementById('rr-current-label').textContent = t('rrCurrentLabel');
            document.getElementById('rr-draw-text').textContent = t('rrDraw');
            document.getElementById('rr-next-text').textContent = t('rrNext');
            document.getElementById('rr-skip-text').textContent = t('rrSkip');
            document.getElementById('picker-page-title').textContent = t('pickerPageTitle');
            document.getElementById('picker-filter-label').textContent = t('pickerFilterLabel');
            document.getElementById('picker-change-text').textContent = t('pickerChange');
            document.getElementById('picker-target-text').textContent = t('pickerTarget');
            document.getElementById('browse-page-title').textContent = t('browsePageTitle');
            document.getElementById('rr-question-text').innerHTML = t('rrDrawPlaceholder');
            document.getElementById('picker-question-text').textContent = t('pickerLoading');

            document.querySelector('.btn-lang').textContent = currentLang === 'zh' ? 'TH' : '中';

            const playerInput = document.getElementById('current-player');
            const currentVal = playerInput.value;
            const prefix = currentLang === 'zh' ? '玩家' : 'คนที่';
            if (currentVal.startsWith('玩家') || currentVal.startsWith('คนที่')) {
                playerInput.value = prefix + ' ' + currentPlayerIndex;
            }
        }

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'th' : 'zh';
            renderUI();
            const activePage = document.querySelector('.page.active');
            if (activePage) {
                const pageId = activePage.id;
                if (pageId === 'picker-page') {
                    renderPickerFilters();
                    refreshQuestionPicker();
                } else if (pageId === 'browse-page') {
                    renderBrowseFilters();
                    renderBrowseList();
                }
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        function goHome() {
            showPage('home-page');
        }

        function startRoundRobin() {
            currentPlayerIndex = 1;
            usedQuestionsRR.clear();
            document.getElementById('current-player').value = (currentLang === 'zh' ? '玩家' : 'คนที่') + ' 1';
            resetRRUI();
            showPage('round-robin-page');
        }

        function resetRRUI() {
            document.getElementById('rr-question-text').innerHTML = t('rrDrawPlaceholder');
            document.getElementById('rr-tags').style.display = 'none';
            document.getElementById('rr-draw-btn').style.display = 'block';
            document.getElementById('rr-actions').style.display = 'none';
            document.getElementById('rr-card').classList.remove('animating');
        }

        function drawQuestionRR() {
            const card = document.getElementById('rr-card');
            const drawBtn = document.getElementById('rr-draw-btn');
            
            drawBtn.disabled = true;
            card.classList.add('animating');
            
            setTimeout(() => {
                const available = questionDB.filter(q => !usedQuestionsRR.has(q.id));
                if (available.length === 0) {
                    usedQuestionsRR.clear();
                }
                const pool = available.length > 0 ? available : questionDB;
                currentQuestionRR = pool[Math.floor(Math.random() * pool.length)];
                usedQuestionsRR.add(currentQuestionRR.id);
                
                document.getElementById('rr-question-text').textContent = qText(currentQuestionRR);
                document.getElementById('rr-category-tag').textContent = currentQuestionRR.category;
                document.getElementById('rr-level-tag').textContent = getLevelLabel(currentQuestionRR.level);
                document.getElementById('rr-level-tag').className = 'tag tag-level-' + currentQuestionRR.level;
                document.getElementById('rr-tags').style.display = 'block';
                
                card.classList.remove('animating');
                drawBtn.style.display = 'none';
                document.getElementById('rr-actions').style.display = 'flex';
                drawBtn.disabled = false;
            }, 300);
        }

        function nextPlayer() {
            currentPlayerIndex++;
            document.getElementById('current-player').value = (currentLang === 'zh' ? '玩家' : 'คนที่') + ' ' + currentPlayerIndex;
            resetRRUI();
        }

        function skipQuestionRR() {
            if (currentQuestionRR) {
                usedQuestionsRR.delete(currentQuestionRR.id);
            }
            drawQuestionRR();
        }

        function startPickerMode() {
            pickerFilter = t('all');
            renderPickerFilters();
            refreshQuestionPicker();
            showPage('picker-page');
        }

        function renderPickerFilters() {
            const container = document.getElementById('picker-filters');
            const allLabel = t('all');
            container.innerHTML = categories.map(cat => {
                const displayCat = (currentLang === 'th' && cat === '中泰友谊') ? t('friendship') : cat;
                return `<button onclick="setPickerFilter('${cat}')" style="padding: 6px 14px; border-radius: 20px; border: 1px solid ${cat === pickerFilter ? 'var(--neon-cyan)' : 'rgba(255,255,255,0.2)'}; background: ${cat === pickerFilter ? 'rgba(0,212,170,0.2)' : 'rgba(255,255,255,0.05)'}; color: ${cat === pickerFilter ? 'var(--neon-cyan)' : 'var(--text-secondary)'}; font-size: 13px; cursor: pointer; transition: all 0.2s;">${cat === '全部' ? allLabel : displayCat}</button>`;
            }).join('');
        }

        function setPickerFilter(category) {
            pickerFilter = category;
            renderPickerFilters();
            refreshQuestionPicker();
        }

        function refreshQuestionPicker() {
            const card = document.getElementById('picker-card');
            card.classList.add('animating');
            
            setTimeout(() => {
                const pool = pickerFilter === '全部' 
                    ? questionDB 
                    : questionDB.filter(q => q.category === pickerFilter);
                currentQuestionPicker = pool[Math.floor(Math.random() * pool.length)];
                
                document.getElementById('picker-question-text').textContent = qText(currentQuestionPicker);
                document.getElementById('picker-category-tag').textContent = currentQuestionPicker.category;
                document.getElementById('picker-level-tag').textContent = getLevelLabel(currentQuestionPicker.level);
                document.getElementById('picker-level-tag').className = 'tag tag-level-' + currentQuestionPicker.level;
                
                card.classList.remove('animating');
            }, 300);
        }

        function showPickerTarget() {
            const name = prompt(t('pickerPrompt'), '');
            if (name && name.trim()) {
                alert(t('pickerAlert') + ' ' + name.trim() + ' ' + t('pickerAlert2'));
            }
        }

        function showBrowsePage() {
            browseFilter = '全部';
            renderBrowseFilters();
            renderBrowseList();
            showPage('browse-page');
        }

        function renderBrowseFilters() {
            const container = document.getElementById('browse-filters');
            const allLabel = t('all');
            container.innerHTML = categories.map(cat => {
                const displayCat = (currentLang === 'th' && cat === '中泰友谊') ? t('friendship') : cat;
                return `<button onclick="setBrowseFilter('${cat}')" style="padding: 6px 14px; border-radius: 20px; border: 1px solid ${cat === browseFilter ? 'var(--neon-cyan)' : 'rgba(255,255,255,0.2)'}; background: ${cat === browseFilter ? 'rgba(0,212,170,0.2)' : 'rgba(255,255,255,0.05)'}; color: ${cat === browseFilter ? 'var(--neon-cyan)' : 'var(--text-secondary)'}; font-size: 13px; cursor: pointer; transition: all 0.2s;">${cat === '全部' ? allLabel : displayCat}</button>`;
            }).join('');
        }

        function setBrowseFilter(category) {
            browseFilter = category;
            renderBrowseFilters();
            renderBrowseList();
        }

        function renderBrowseList() {
            const container = document.getElementById('browse-list');
            const list = browseFilter === '全部' 
                ? questionDB 
                : questionDB.filter(q => q.category === browseFilter);
            
            container.innerHTML = list.map(q => `
                <div class="card" style="padding: 16px;">
                    <div style="margin-bottom: 8px;">
                        <span class="tag tag-category" style="font-size: 11px;">${q.category}</span>
                        <span class="tag tag-level-${q.level}" style="font-size: 11px;">${getLevelLabel(q.level)}</span>
                    </div>
                    <div style="font-size: 15px; line-height: 1.5;">${qText(q)}</div>
                </div>
            `).join('');
        }

        function shareGame() {
            const url = 'https://calvinfuchoco.github.io/icebreaker-game/';
            const text = t('shareText');
            
            if (navigator.share) {
                navigator.share({
                    title: t('shareTitle'),
                    text: text,
                    url: url
                }).catch(() => {});
            } else {
                const input = document.createElement('textarea');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert(t('shareCopied'));
            }
        }
    </script>
</body>
</html>
