<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>破冰派对 - 陌生人问答游戏</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.05);
            --neon-cyan: #00d4aa;
            --neon-pink: #ff6b9d;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --border-radius: 20px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 212, 170, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(255, 107, 157, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        .page {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .page.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            width: 100%;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), #00a884);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 212, 170, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 212, 170, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.96);
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .question-card {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .question-card.animating {
            transform: scale(0.8);
            filter: blur(4px);
        }

        .question-text {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.5;
            color: #f5e6d3;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin: 4px;
        }

        .tag-category {
            background: rgba(0, 212, 170, 0.2);
            color: var(--neon-cyan);
        }

        .tag-level-easy {
            background: rgba(0, 212, 170, 0.15);
            color: #4ade80;
        }

        .tag-level-medium {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .tag-level-hard {
            background: rgba(255, 107, 157, 0.15);
            color: var(--neon-pink);
        }

        input[type="text"] {
            -webkit-appearance: none;
            appearance: none;
        }

        button {
            touch-action: manipulation;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div id="home-page" class="page active">
        <div class="container" style="justify-content: center;">
            <div style="text-align: center;">
                <div style="margin-bottom: 40px;">
                    <div style="font-size: 64px; margin-bottom: 16px;">🎉</div>
                    <h1 style="font-size: 36px; font-weight: 800; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;">破冰派对</h1>
                    <p style="color: var(--text-secondary); font-size: 16px;">让陌生的朋友，快速熟悉起来</p>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px;">
                    <button class="btn btn-primary" onclick="startRoundRobin()">
                        <div style="font-size: 20px; margin-bottom: 4px;">🔄</div>
                        <div>轮流模式</div>
                        <div style="font-size: 12px; font-weight: 400; opacity: 0.8; margin-top: 4px;">轮流转盘抽题，抽到的人回答</div>
                    </button>
                    
                    <button class="btn btn-secondary" onclick="startPickerMode()">
                        <div style="font-size: 20px; margin-bottom: 4px;">🎯</div>
                        <div>出题模式</div>
                        <div style="font-size: 12px; font-weight: 400; opacity: 0.7; margin-top: 4px;">你选问题，指定某人回答</div>
                    </button>
                </div>
                
                <button class="btn btn-secondary" onclick="showBrowsePage()" style="font-size: 14px; padding: 12px;">
                    📚 浏览问题库
                </button>
            </div>
        </div>
    </div>

    <!-- 轮流模式 -->
    <div id="round-robin-page" class="page">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="back-btn" onclick="goHome()">←</button>
                <h2 style="font-size: 18px; font-weight: 600;">轮流模式</h2>
                <div style="width: 40px;"></div>
            </div>
            
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">当前回答者</div>
                <input type="text" id="current-player" value="玩家 1" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 12px 20px; color: white; font-size: 18px; text-align: center; width: 200px; outline: none;">
            </div>
            
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <div id="rr-card" class="question-card" style="margin-bottom: 30px;">
                    <div id="rr-tags" style="margin-bottom: 16px; display: none;">
                        <span id="rr-category-tag" class="tag tag-category"></span>
                        <span id="rr-level-tag" class="tag"></span>
                    </div>
                    <div id="rr-question-text" class="question-text">
                        点击下方按钮<br>抽取一个问题
                    </div>
                </div>
                
                <button id="rr-draw-btn" class="btn btn-primary" onclick="drawQuestionRR()" style="margin-bottom: 12px;">
                    🎲 抽一个问题
                </button>
                
                <div id="rr-actions" style="display: none; flex-direction: column; gap: 12px;">
                    <button class="btn btn-primary" onclick="nextPlayer()">
                        ✓ 回答完毕，下一位
                    </button>
                    <button class="btn btn-secondary" onclick="skipQuestionRR()">
                        ↷ 跳过，重抽
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 出题模式 -->
    <div id="picker-page" class="page">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="back-btn" onclick="goHome()">←</button>
                <h2 style="font-size: 18px; font-weight: 600;">出题模式</h2>
                <div style="width: 40px;"></div>
            </div>
            
            <div style="margin-bottom: 20px;">
                <div style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">问题分类</div>
                <div id="picker-filters" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>
            
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <div id="picker-card" class="question-card" style="margin-bottom: 30px;">
                    <div id="picker-tags" style="margin-bottom: 16px;">
                        <span id="picker-category-tag" class="tag tag-category"></span>
                        <span id="picker-level-tag" class="tag"></span>
                    </div>
                    <div id="picker-question-text" class="question-text">
                        加载中...
                    </div>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button class="btn btn-primary" onclick="refreshQuestionPicker()">
                        🔄 换一题
                    </button>
                    <button class="btn btn-secondary" onclick="showPickerTarget()">
                        🎯 指定回答
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 浏览问题库 -->
    <div id="browse-page" class="page">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="back-btn" onclick="goHome()">←</button>
                <h2 style="font-size: 18px; font-weight: 600;">问题库</h2>
                <div style="width: 40px;"></div>
            </div>
            
            <div style="margin-bottom: 16px;">
                <div id="browse-filters" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>
            
            <div id="browse-list" style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1;"></div>
        </div>
    </div>

    <script>
        const questionDB = [
            { id: 1, question: "如果你只能穿一种颜色的衣服过一辈子，你会选什么颜色？", category: "穿搭时尚", level: "easy" },
            { id: 2, question: "你今天的穿搭灵感是什么？", category: "穿搭时尚", level: "easy" },
            { id: 3, question: "如果预算无限，你最想入手的一件单品是什么？", category: "穿搭时尚", level: "easy" },
            { id: 4, question: "你是什么风格？极简/街头/复古/甜美/运动？", category: "穿搭时尚", level: "easy" },
            { id: 5, question: "你买过最后悔的一件衣服是什么？", category: "穿搭时尚", level: "medium" },
            { id: 6, question: "如果让你给今天的自己搭配一套衣服，你会怎么搭？", category: "穿搭时尚", level: "easy" },
            { id: 7, question: "你觉得穿搭最重要的是什么？舒适/个性/品牌/潮流？", category: "穿搭时尚", level: "medium" },
            { id: 8, question: "你有没有因为某件衣服被夸过？", category: "穿搭时尚", level: "easy" },
            { id: 9, question: "如果要去一个荒岛，只能带三件衣服，你带什么？", category: "穿搭时尚", level: "medium" },
            { id: 10, question: "你最喜欢的时尚博主或明星是谁？", category: "穿搭时尚", level: "easy" },

            { id: 11, question: "猫派还是狗派？为什么？", category: "宠物生活", level: "easy" },
            { id: 12, question: "如果你可以养任何动物当宠物（不限现实），你选什么？", category: "宠物生活", level: "medium" },
            { id: 13, question: "你宠物最搞笑的一个习惯是什么？（没养可以说理想的）", category: "宠物生活", level: "easy" },
            { id: 14, question: "你觉得养宠物最大的挑战是什么？", category: "宠物生活", level: "medium" },
            { id: 15, question: "如果宠物会说话，你觉得它第一句会说什么？", category: "宠物生活", level: "medium" },
            { id: 16, question: "你更喜欢大型宠物还是小型宠物？", category: "宠物生活", level: "easy" },
            { id: 17, question: "如果让你变成一种动物，你想变成什么？", category: "宠物生活", level: "medium" },
            { id: 18, question: "你最喜欢去动物园看哪种动物？", category: "宠物生活", level: "easy" },
            { id: 19, question: "你觉得养宠物和养孩子哪个更难？", category: "宠物生活", level: "hard" },
            { id: 20, question: "描述一下你理想中宠物的一天生活", category: "宠物生活", level: "medium" },

            { id: 21, question: "你吃过最奇怪的食物是什么？", category: "美食旅行", level: "easy" },
            { id: 22, question: "如果明天可以免费飞去任何地方吃顿饭，你去哪？", category: "美食旅行", level: "medium" },
            { id: 23, question: "甜咸豆腐脑/汤圆，你站哪边？", category: "美食旅行", level: "easy" },
            { id: 24, question: "你最喜欢的家乡美食是什么？", category: "美食旅行", level: "easy" },
            { id: 25, question: "如果只能吃一种 cuisine（中餐/日料/意餐/泰餐等）一辈子，你选哪个？", category: "美食旅行", level: "medium" },
            { id: 26, question: "你最想尝试但还没机会吃的美食是什么？", category: "美食旅行", level: "easy" },
            { id: 27, question: "如果让你推荐一家你城市最好吃的店，你推荐哪家？", category: "美食旅行", level: "easy" },
            { id: 28, question: "你旅行时最看重什么？美食/风景/文化/购物？", category: "美食旅行", level: "medium" },
            { id: 29, question: "你最难忘的一次旅行经历是什么？", category: "美食旅行", level: "medium" },
            { id: 30, question: "如果可以去世界上任何一个地方住一年，你选哪里？", category: "美食旅行", level: "medium" },
            { id: 31, question: "你更喜欢海边还是山里？", category: "美食旅行", level: "easy" },
            { id: 32, question: "旅行中你必带的三样东西是什么？", category: "美食旅行", level: "easy" },

            { id: 33, question: "最近有看什么剧/电影/综艺吗？推荐一部", category: "社会潮流", level: "easy" },
            { id: 34, question: "如果只能留一个 App 在手机里，你留哪个？", category: "社会潮流", level: "medium" },
            { id: 35, question: "你相信 AI 会取代你的工作吗？", category: "社会潮流", level: "medium" },
            { id: 36, question: "你最近单曲循环的一首歌是什么？", category: "社会潮流", level: "easy" },
            { id: 37, question: "如果穿越回十年前，你会对自己说什么？", category: "社会潮流", level: "medium" },
            { id: 38, question: "你觉得未来十年最大的变化会是什么？", category: "社会潮流", level: "hard" },
            { id: 39, question: "你更喜欢线上社交还是线下见面？", category: "社会潮流", level: "easy" },
            { id: 40, question: "如果有一百万，你会怎么花？", category: "社会潮流", level: "medium" },
            { id: 41, question: "你觉得什么是现在年轻人最焦虑的事？", category: "社会潮流", level: "hard" },
            { id: 42, question: "你最近学到的一个新技能或知识是什么？", category: "社会潮流", level: "easy" },

            { id: 43, question: "你最喜欢的品质是什么？（自己或他人）", category: "普鲁斯特问卷", level: "medium" },
            { id: 44, question: "你最痛恨自己的哪个特点？", category: "普鲁斯特问卷", level: "hard" },
            { id: 45, question: "如果可以改变一件事，你最想改变什么？", category: "普鲁斯特问卷", level: "hard" },
            { id: 46, question: "你最大的恐惧是什么？", category: "普鲁斯特问卷", level: "hard" },
            { id: 47, question: "你最理想的生活状态是什么样的？", category: "普鲁斯特问卷", level: "medium" },
            { id: 48, question: "你觉得自己最大的优点是什么？", category: "普鲁斯特问卷", level: "medium" },
            { id: 49, question: "如果可以重来，你最想修正的一个决定是什么？", category: "普鲁斯特问卷", level: "hard" },
            { id: 50, question: "你觉得什么是真正的幸福？", category: "普鲁斯特问卷", level: "hard" },
            { id: 51, question: "你最珍惜的一段关系是什么？", category: "普鲁斯特问卷", level: "medium" },
            { id: 52, question: "如果可以拥有一种超能力，你选什么？为什么？", category: "普鲁斯特问卷", level: "medium" },

            { id: 53, question: "如果你有一种超能力，但必须付出一个代价，你选什么？", category: "趣味脑洞", level: "medium" },
            { id: 54, question: "如果可以和任何历史人物吃顿饭，你选谁？", category: "趣味脑洞", level: "medium" },
            { id: 55, question: "描述一下你理想中完美的一天", category: "趣味脑洞", level: "easy" },
            { id: 56, question: "如果你是一部电影的主角，会是什么类型的电影？", category: "趣味脑洞", level: "medium" },
            { id: 57, question: "如果明天醒来你变成了一种颜色，你希望是什么颜色？", category: "趣味脑洞", level: "easy" },
            { id: 58, question: "你觉得你的灵魂动物是什么？", category: "趣味脑洞", level: "easy" },
            { id: 59, question: "如果可以和任何虚构角色做一天朋友，你选谁？", category: "趣味脑洞", level: "medium" },
            { id: 60, question: "你觉得十年后的自己会在做什么？", category: "趣味脑洞", level: "medium" },
            { id: 61, question: "如果世界上只剩最后一顿饭，你想吃什么？", category: "趣味脑洞", level: "easy" },
            { id: 62, question: "你觉得外星人存在吗？如果存在，它们长什么样？", category: "趣味脑洞", level: "easy" }
        ];

        const categories = ["全部", "穿搭时尚", "宠物生活", "美食旅行", "社会潮流", "普鲁斯特问卷", "趣味脑洞"];

        let currentPlayerIndex = 1;
        let currentQuestionRR = null;
        let usedQuestionsRR = new Set();
        let pickerFilter = '全部';
        let currentQuestionPicker = null;
        let browseFilter = '全部';

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        function goHome() {
            showPage('home-page');
        }

        function startRoundRobin() {
            currentPlayerIndex = 1;
            usedQuestionsRR.clear();
            document.getElementById('current-player').value = '玩家 1';
            resetRRUI();
            showPage('round-robin-page');
        }

        function resetRRUI() {
            document.getElementById('rr-question-text').innerHTML = '点击下方按钮<br>抽取一个问题';
            document.getElementById('rr-tags').style.display = 'none';
            document.getElementById('rr-draw-btn').style.display = 'block';
            document.getElementById('rr-actions').style.display = 'none';
            document.getElementById('rr-card').classList.remove('animating');
        }

        function drawQuestionRR() {
            const card = document.getElementById('rr-card');
            const drawBtn = document.getElementById('rr-draw-btn');
            
            drawBtn.disabled = true;
            card.classList.add('animating');
            
            setTimeout(() => {
                const available = questionDB.filter(q => !usedQuestionsRR.has(q.id));
                if (available.length === 0) {
                    usedQuestionsRR.clear();
                }
                const pool = available.length > 0 ? available : questionDB;
                currentQuestionRR = pool[Math.floor(Math.random() * pool.length)];
                usedQuestionsRR.add(currentQuestionRR.id);
                
                document.getElementById('rr-question-text').textContent = currentQuestionRR.question;
                document.getElementById('rr-category-tag').textContent = currentQuestionRR.category;
                document.getElementById('rr-level-tag').textContent = 
                    currentQuestionRR.level === 'easy' ? '轻松' : 
                    currentQuestionRR.level === 'medium' ? '趣味' : '深度';
                document.getElementById('rr-level-tag').className = 'tag tag-level-' + currentQuestionRR.level;
                document.getElementById('rr-tags').style.display = 'block';
                
                card.classList.remove('animating');
                drawBtn.style.display = 'none';
                document.getElementById('rr-actions').style.display = 'flex';
                drawBtn.disabled = false;
            }, 300);
        }

        function nextPlayer() {
            currentPlayerIndex++;
            document.getElementById('current-player').value = '玩家 ' + currentPlayerIndex;
            resetRRUI();
        }

        function skipQuestionRR() {
            if (currentQuestionRR) {
                usedQuestionsRR.delete(currentQuestionRR.id);
            }
            drawQuestionRR();
        }

        function startPickerMode() {
            pickerFilter = '全部';
            renderPickerFilters();
            refreshQuestionPicker();
            showPage('picker-page');
        }

        function renderPickerFilters() {
            const container = document.getElementById('picker-filters');
            container.innerHTML = categories.map(cat => 
                `<button onclick="setPickerFilter('${cat}')" style="padding: 6px 14px; border-radius: 20px; border: 1px solid ${cat === pickerFilter ? 'var(--neon-cyan)' : 'rgba(255,255,255,0.2)'}; background: ${cat === pickerFilter ? 'rgba(0,212,170,0.2)' : 'rgba(255,255,255,0.05)'}; color: ${cat === pickerFilter ? 'var(--neon-cyan)' : 'var(--text-secondary)'}; font-size: 13px; cursor: pointer; transition: all 0.2s;">${cat}</button>`
            ).join('');
        }

        function setPickerFilter(category) {
            pickerFilter = category;
            renderPickerFilters();
            refreshQuestionPicker();
        }

        function refreshQuestionPicker() {
            const card = document.getElementById('picker-card');
            card.classList.add('animating');
            
            setTimeout(() => {
                const pool = pickerFilter === '全部' 
                    ? questionDB 
                    : questionDB.filter(q => q.category === pickerFilter);
                currentQuestionPicker = pool[Math.floor(Math.random() * pool.length)];
                
                document.getElementById('picker-question-text').textContent = currentQuestionPicker.question;
                document.getElementById('picker-category-tag').textContent = currentQuestionPicker.category;
                document.getElementById('picker-level-tag').textContent = 
                    currentQuestionPicker.level === 'easy' ? '轻松' : 
                    currentQuestionPicker.level === 'medium' ? '趣味' : '深度';
                document.getElementById('picker-level-tag').className = 'tag tag-level-' + currentQuestionPicker.level;
                
                card.classList.remove('animating');
            }, 300);
        }

        function showPickerTarget() {
            const name = prompt('请指定回答者名字（可选）:', '');
            if (name && name.trim()) {
                alert(`请 ${name.trim()} 回答这个问题！`);
            }
        }

        function showBrowsePage() {
            browseFilter = '全部';
            renderBrowseFilters();
            renderBrowseList();
            showPage('browse-page');
        }

        function renderBrowseFilters() {
            const container = document.getElementById('browse-filters');
            container.innerHTML = categories.map(cat => 
                `<button onclick="setBrowseFilter('${cat}')" style="padding: 6px 14px; border-radius: 20px; border: 1px solid ${cat === browseFilter ? 'var(--neon-cyan)' : 'rgba(255,255,255,0.2)'}; background: ${cat === browseFilter ? 'rgba(0,212,170,0.2)' : 'rgba(255,255,255,0.05)'}; color: ${cat === browseFilter ? 'var(--neon-cyan)' : 'var(--text-secondary)'}; font-size: 13px; cursor: pointer; transition: all 0.2s;">${cat}</button>`
            ).join('');
        }

        function setBrowseFilter(category) {
            browseFilter = category;
            renderBrowseFilters();
            renderBrowseList();
        }

        function renderBrowseList() {
            const container = document.getElementById('browse-list');
            const list = browseFilter === '全部' 
                ? questionDB 
                : questionDB.filter(q => q.category === browseFilter);
            
            container.innerHTML = list.map(q => `
                <div class="card" style="padding: 16px;">
                    <div style="margin-bottom: 8px;">
                        <span class="tag tag-category" style="font-size: 11px;">${q.category}</span>
                        <span class="tag tag-level-${q.level}" style="font-size: 11px;">${q.level === 'easy' ? '轻松' : q.level === 'medium' ? '趣味' : '深度'}</span>
                    </div>
                    <div style="font-size: 15px; line-height: 1.5;">${q.question}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
